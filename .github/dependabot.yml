# Weekly dependency-update PRs. CI (.github/workflows/docker-publish.yml) runs
# the tests and the image builds on each one: merge when it's green.
# Minor/patch bumps are grouped into one PR per ecosystem to keep the noise
# down; major bumps arrive as separate PRs, since those are the ones that break.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /keycloakify-starter
    schedule:
      interval: weekly
    groups:
      theme-minor-patch:
        update-types: [minor, patch]

  # Base images in the three Dockerfiles.
  - package-ecosystem: docker
    directories: [/backend, /frontend, /keycloakify-starter]
    schedule:
      interval: weekly
    ignore:
      # Stay on Python 3.12: CI's test job uses the same version, and native
      # wheels (shap, lightgbm) tend to lag behind new Python releases.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
