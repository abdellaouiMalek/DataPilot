# Weekly dependency-update PRs. CI (.github/workflows/docker-publish.yml) runs
# the tests and the image builds on each one: merge when it's green.
# Minor/patch bumps are grouped into one PR per ecosystem to keep the noise
# down. Major bumps of npm packages and base images are not proposed at all:
# they need real migration work (React 19, TypeScript 7, Node 26...) rather
# than a one-click merge, so upgrade those by hand when you choose to.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /keycloakify-starter
    schedule:
      interval: weekly
    groups:
      theme-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Base images in the three Dockerfiles.
  - package-ecosystem: docker
    directories: [/backend, /frontend, /keycloakify-starter]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Stay on Python 3.12: CI's test job uses the same version, and native
      # wheels (shap, lightgbm) tend to lag behind new Python releases.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
