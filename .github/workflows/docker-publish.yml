name: CI

# Runs the backend and frontend test suites, then builds the three DataPilot
# images and publishes them to GitHub Container Registry as
# ghcr.io/<owner>/datapilot-{backend,frontend,keycloak}. Images are only built
# once both test jobs pass.
#
#   push to main   -> :latest and :sha-<short>
#   tag vX.Y.Z     -> :X.Y.Z, :X.Y and :sha-<short>
#   pull request   -> tests + image build only, nothing is pushed

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as the app database: the schema has pgvector columns.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datapilot_test
        ports:
          - 5432:5432
        # Over TCP on purpose: during first-boot init Postgres only listens on
        # its Unix socket, so a socket check can pass before datapilot_test
        # has been created.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d datapilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # tests/conftest.py swaps the database name for datapilot_test.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/datapilot
      # Empty key: every LLM feature takes its non-LLM fallback.
      LLM_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Enable pgvector in the test database
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -d datapilot_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      # app/services/pdf.py imports WeasyPrint at module load, so merely
      # importing the app needs its native Pango libraries.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest
        run: python -m pytest

  frontend-tests:
    name: frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Run vitest
        run: npm test

  image:
    name: ${{ matrix.image }}
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: datapilot-backend
            context: backend
          - image: datapilot-frontend
            context: frontend
          - image: datapilot-keycloak
            context: keycloakify-starter
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
