# The whole DataPilot app from the published images, on localhost. Nothing
# to install but Docker:
#
#   docker compose -f docker-compose.app.yml up -d
#
# then open http://localhost:5174. The first start takes a few minutes
# (image download, Keycloak realm import). Stop with
# `docker compose -f docker-compose.app.yml down` (add -v to wipe the data).
#
#   http://localhost:5174   the app
#   http://localhost:8001   the API
#   http://localhost:8086   Keycloak (admin console: admin / admin)
#
# Separate from docker-compose.yml, the dev infra for running the backend and
# frontend from source: own project name and volumes, and ports that don't
# clash with the dev ones (5173 / 8000 / 8085), so both can run at once.
#
# Local use only: default passwords, plain HTTP, and the dev realm (users and
# client secret) from keycloak/import/.
name: datapilot-app

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/datapilot
  # The browser-facing URL, which is also the issuer of the tokens the
  # backend checks; its own calls go straight to the container instead.
  KEYCLOAK_URL: http://localhost:8086
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  KEYCLOAK_REALM: datapilot
  KEYCLOAK_CLIENT_ID: datapilot-frontend
  KEYCLOAK_SUPER_ADMIN_ROLE: super_admin
  KEYCLOAK_ADMIN_CLIENT_ID: datapilot-backend
  # The datapilot-backend client's secret in keycloak/import/datapilot-realm.json.
  KEYCLOAK_ADMIN_CLIENT_SECRET: q4rtEVfYYqjNlFJAnnZOkIFrbBxG2Fxl
  FRONTEND_URL: http://localhost:5174
  # AI features use Ollama on this machine if it's running (`ollama pull
  # qwen2.5:3b` and `ollama pull bge-m3`); otherwise they fall back to their
  # non-LLM output.
  LLM_BASE_URL: http://host.docker.internal:11434/v1
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
  # Optional, read from your shell or a .env file next to this one: SMTP for
  # temporary-password emails, and the cloud model for "Veille réglementaire".
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-DataPilot}
  REG_LLM_PROVIDER: ${REG_LLM_PROVIDER:-openai}
  REG_LLM_BASE_URL: ${REG_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
  REG_LLM_API_KEY: ${REG_LLM_API_KEY:-}
  REG_LLM_MODEL: ${REG_LLM_MODEL:-gemini-3.5-flash}

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datapilot
    volumes:
      - pgdata:/var/lib/postgresql
      # Creates Keycloak's database on first boot (empty volume only).
      - ./db/init/01-create-keycloak-db.sql:/docker-entrypoint-initdb.d/01-create-keycloak-db.sql:ro
    healthcheck:
      # Over TCP: during first-boot init Postgres only listens on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d datapilot"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: ghcr.io/abdellaouimalek/datapilot-keycloak:latest
    # Imports keycloak/import/ only if the realm doesn't exist yet.
    command: ["start", "--optimized", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: http://localhost:8086
      KC_HTTP_ENABLED: "true"
    ports:
      - "8086:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # Healthy once the datapilot realm answers, not just the server: since
      # 26.8 Keycloak imports the realm in the background after reporting
      # ready. No curl in the image, hence the raw HTTP request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/datapilot HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  backend:
    image: ghcr.io/abdellaouimalek/datapilot-backend:latest
    # Creates/migrates/seeds the database on start (docker-entrypoint.sh).
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    volumes:
      - logos:/app/app/static/logos

  # One-off: re-applies the realm settings a realm import loses
  # (app/keycloak_bootstrap.py) once Keycloak is up, then exits.
  keycloak-setup:
    image: ghcr.io/abdellaouimalek/datapilot-backend:latest
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      <<: *backend-env
      RUN_DB_INIT: "false"
    command: ["python", "-m", "app.keycloak_bootstrap"]

  frontend:
    image: ghcr.io/abdellaouimalek/datapilot-frontend:latest
    # Written into /env.js at container start (frontend/src/lib/env.ts).
    environment:
      VITE_API_URL: http://localhost:8001
      VITE_KEYCLOAK_URL: http://localhost:8086
      VITE_KEYCLOAK_REALM: datapilot
      VITE_KEYCLOAK_CLIENT_ID: datapilot-frontend
    ports:
      - "5174:80"

volumes:
  pgdata:
  logos:
