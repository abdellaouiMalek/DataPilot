# DataPilot infrastructure: dedicated Postgres (app DB + Keycloak DB) and Keycloak
# with the Keycloakify EY login theme and automatic realm import on first boot.
#
# Build the theme jar before `up` (it's a local build artifact, not committed):
#   cd keycloakify-starter && npm run build-keycloak-theme
#
# Postgres holds two databases on the same server:
#   - datapilot  (FastAPI app: dimensions, questions, assessments, scores)
#   - keycloak   (Keycloak's internal schema: users, roles, credentials)
# Host port 5434 (5433 is taken by another project's container).
#
# pgvector/pgvector:pg18 instead of the plain postgres:18 image -- same
# official Postgres 18 base, just with the `vector` extension compiled in
# (needed by the Veille réglementaire RAG index, see
# app/models/embedding.py). This is THE app database: the backend's
# DATABASE_URL points here, not at any natively-installed Postgres --
# pgvector can't be installed into a native Windows Postgres without an
# elevated terminal (confirmed: writing into its Program Files extension
# directory is denied), so the Docker instance is the real one.
#
# The realm import file (keycloak/import/) is a FULL export including users;
# import runs only when the keycloak database is empty.
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: datapilot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datapilot
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - datapilot-pgdata:/var/lib/postgresql
      # Creates the extra "keycloak" database on first boot (empty volume only)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datapilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    ports:
      - "8085:8080"
    volumes:
      # EY Keycloakify login theme (rebuild the jar, then `docker compose restart keycloak`)
      - ./keycloakify-starter/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/datapilot-theme.jar:ro
      # Realm imported on first boot (skipped if the realm already exists in the DB)
      - ./keycloak/import:/opt/keycloak/data/import:ro

volumes:
  datapilot-pgdata:
