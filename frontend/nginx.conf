# Serves the built SPA. The API is a separate container (VITE_API_URL).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Written per-container at startup (docker/40-runtime-env.sh): never cache.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # Must always be revalidated so a deploy picks up the new hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's content-hashed bundles: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (react-router) fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
