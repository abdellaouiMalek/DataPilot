[pytest]
# Makes `from app...` / `from llm...` importable from any test file without
# each one needing its own sys.path hack (the 2 pre-existing manual scripts
# did this by hand; pytest can just be told the backend/ root once).
pythonpath = .
testpaths = tests
# anyio (already an installed FastAPI/Starlette dependency) drives the
# async integration tests -- no extra pytest-asyncio dependency needed.
markers =
    anyio: mark a test to run under the anyio pytest plugin's event loop
# Third-party noise, not ours to fix: shap builds a colormap at import time
# (app/services/explain.py imports it eagerly, see that module's docstring)
# using matplotlib Colormap methods (set_bad/set_over/set_under) that a
# newer matplotlib has pending-deprecated. Fires the instant `app.main` is
# imported for the test client -- no test here calls any SHAP plotting
# function. Scoped to that exact module so a real warning elsewhere in the
# suite still surfaces normally.
filterwarnings =
    ignore::PendingDeprecationWarning:shap.plots.colors._colors
