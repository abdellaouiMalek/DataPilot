<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{{ report_title }}</title>
<style>
  @page {
    size: A4;
    margin: 22mm 16mm 20mm 16mm;
    @top-left {
      /* CSS generated content doesn't decode HTML entities, so this one
         interpolation must bypass Jinja2's autoescaping (report_title is
         always one of our own static strings, never user input). */
      content: "{{ report_title | safe }}";
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 8pt;
      color: #9B9B9B;
    }
    @bottom-left {
      content: "DataPilot — EY Data Maturity Assessment";
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 7.5pt;
      color: #B0B0B0;
    }
    @bottom-right {
      content: "Page " counter(page) " / " counter(pages);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 7.5pt;
      color: #B0B0B0;
    }
  }
  @page cover {
    margin: 0;
    @top-left { content: none; }
    @bottom-left { content: none; }
    @bottom-right { content: none; }
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #1A1A1A;
    font-size: 9.5pt;
    line-height: 1.5;
    margin: 0;
  }

  h1, h2, h3, p, ul, ol { margin: 0; }

  /* ── Cover page ───────────────────────────────────────────────── */
  .cover {
    page: cover;
    width: 210mm;
    height: 297mm;
    background: #1A1A1A;
    color: #fff;
    position: relative;
    page-break-after: always;
  }
  .cover .accent-bar { height: 6mm; background: #FFE600; }
  .cover .content {
    padding: 26mm 20mm 0 20mm;
  }
  .cover .logo { width: 30mm; margin-bottom: 20mm; }
  .cover .kicker {
    font-size: 9pt;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: #FFE600;
    text-transform: uppercase;
    margin-bottom: 6mm;
  }
  .cover .title {
    font-size: 27pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.25;
    max-width: 140mm;
  }
  .cover .subtitle {
    font-size: 12pt;
    color: rgba(255,255,255,0.62);
    margin-top: 6mm;
    max-width: 140mm;
  }
  .cover .meta-grid {
    margin-top: 22mm;
    display: flex;
    flex-wrap: wrap;
  }
  .cover .meta-item {
    width: 50%;
    margin-bottom: 8mm;
  }
  .cover .meta-label {
    font-size: 7.5pt;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.40);
    margin-bottom: 2mm;
  }
  .cover .meta-value {
    font-size: 12pt;
    font-weight: 600;
    color: #fff;
  }
  .cover .footer {
    position: absolute;
    bottom: 16mm;
    left: 20mm;
    right: 20mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.14);
    padding-top: 6mm;
  }
  .cover .footer .confidential {
    font-size: 7.5pt;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }
  .cover .footer .date {
    font-size: 9pt;
    color: rgba(255,255,255,0.75);
  }

  /* ── Section shell ────────────────────────────────────────────── */
  .section { margin-bottom: 7mm; page-break-inside: avoid; }
  .section-title {
    font-size: 12pt;
    font-weight: 700;
    color: #1A1A1A;
    margin-bottom: 3.5mm;
    padding-bottom: 2mm;
    border-bottom: 1.5pt solid #1A1A1A;
  }
  .section-subtitle {
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #9B9B9B;
    margin-bottom: 2mm;
  }
  .muted { color: #6B6B6B; }
  .small { font-size: 8pt; }

  /* ── KPI cards ────────────────────────────────────────────────── */
  .kpi-row { display: flex; gap: 4mm; }
  .kpi-card {
    flex: 1;
    border: 0.75pt solid #E5E5E5;
    border-radius: 2mm;
    padding: 4mm 5mm;
  }
  .kpi-card.dark { background: #1A1A1A; border-color: #1A1A1A; color: #fff; }
  .kpi-label {
    font-size: 7.5pt;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #9B9B9B;
    margin-bottom: 2.5mm;
  }
  .kpi-card.dark .kpi-label { color: rgba(255,255,255,0.45); }
  .kpi-value { font-size: 21pt; font-weight: 700; color: #1A1A1A; }
  .kpi-card.dark .kpi-value { color: #FFE600; }
  .kpi-value .unit { font-size: 9pt; font-weight: 500; color: #B0B0B0; }
  .kpi-card.dark .kpi-value .unit { color: rgba(255,255,255,0.35); }
  .badge {
    display: inline-block;
    font-size: 7.5pt;
    font-weight: 700;
    padding: 1mm 2.5mm;
    border-radius: 1mm;
    margin-top: 2.5mm;
  }

  /* ── Dimension bars ───────────────────────────────────────────── */
  .dim-row {
    display: flex;
    align-items: center;
    padding: 2.6mm 0;
    border-bottom: 0.5pt solid #EFEFEF;
  }
  .dim-row:last-child { border-bottom: none; }
  .dim-name { width: 46mm; font-size: 8.5pt; font-weight: 600; color: #1A1A1A; padding-right: 3mm; }
  .dim-bar-track {
    flex: 1;
    height: 3mm;
    background: #F0F0F0;
    border-radius: 1.5mm;
    overflow: hidden;
    position: relative;
  }
  .dim-bar-fill { height: 100%; border-radius: 1.5mm; }
  .dim-score { width: 16mm; text-align: right; font-size: 9.5pt; font-weight: 700; color: #1A1A1A; padding-left: 3mm; }

  /* ── Tables ───────────────────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 7.5pt;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9B9B9B;
    padding: 2.5mm 3mm;
    background: #FAFAFA;
    border-bottom: 0.75pt solid #E5E5E5;
  }
  td {
    font-size: 8.5pt;
    padding: 2.8mm 3mm;
    border-bottom: 0.5pt solid #EFEFEF;
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }

  /* ── Narrative box ────────────────────────────────────────────── */
  .narrative-box {
    background: #FAFAFA;
    border-left: 2.5pt solid #FFE600;
    border-radius: 0 1.5mm 1.5mm 0;
    padding: 4.5mm 5.5mm;
    font-size: 8.75pt;
    line-height: 1.65;
    color: #333;
  }

  /* ── Recommendation cards ─────────────────────────────────────── */
  .rec-card {
    border: 0.75pt solid #E5E5E5;
    border-radius: 1.5mm;
    padding: 3.5mm 4.5mm;
    margin-bottom: 2.5mm;
    page-break-inside: avoid;
  }
  .rec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5mm; }
  .rec-title { font-size: 9pt; font-weight: 700; color: #1A1A1A; }
  .rec-rank {
    display: inline-block;
    width: 5mm; height: 5mm;
    line-height: 5mm;
    text-align: center;
    border-radius: 50%;
    background: #1A1A1A;
    color: #FFE600;
    font-size: 7.5pt;
    font-weight: 700;
    margin-right: 2.5mm;
  }
  .rec-text { font-size: 8.25pt; color: #4A4A4A; line-height: 1.55; }
  .rec-tags { margin-top: 2mm; }
  .tag {
    display: inline-block;
    font-size: 7pt;
    font-weight: 600;
    padding: 0.7mm 2mm;
    border-radius: 3mm;
    background: #F0F0F0;
    color: #6B6B6B;
    margin-right: 1.5mm;
  }
  .tag.regulatory { background: #FFF3E0; color: #9A5B00; }

  .legend { display: flex; gap: 5mm; margin-top: 2.5mm; }
  .legend-item { display: flex; align-items: center; font-size: 7.5pt; color: #6B6B6B; }
  .legend-dot { width: 2.6mm; height: 2.6mm; border-radius: 50%; margin-right: 1.6mm; display: inline-block; }
  .legend-line { width: 4.5mm; height: 0; border-top: 1.4pt solid; margin-right: 1.6mm; display: inline-block; }
</style>
</head>
<body>

<section class="cover">
  <div class="accent-bar"></div>
  <div class="content">
    <img class="logo" src="ey_logo.png" alt="EY">
    <div class="kicker">EY Data Maturity Assessment</div>
    <h1 class="title">{{ report_title }}</h1>
    <p class="subtitle">{{ report_subtitle }}</p>

    <div class="meta-grid">
      {% for item in cover_meta %}
      <div class="meta-item">
        <div class="meta-label">{{ item.label }}</div>
        <div class="meta-value">{{ item.value }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
  <div class="footer">
    <span class="confidential">Document confidentiel — usage interne</span>
    <span class="date">Généré le {{ generated_at.strftime('%d/%m/%Y à %H:%M') }}</span>
  </div>
</section>

{% block content %}{% endblock %}

</body>
</html>
